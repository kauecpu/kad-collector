ano = "2026"
concurso = "DPE Bahia 2026"
orgao = "Defensoria Publica do Estado da Bahia"
[[sources.expected]]
kind = "answer_key"
pattern = "(?i)edital_dos_gabaritos_prova_objetiva\\.pdf"

