schema_version = 1

# Baseline definida em 08/09/2026 antes da execução. Cada item descreve o
# mínimo publicamente anunciado na própria página oficial; documentos extras
# só contam como corretos quando continuam sendo prova ou gabarito.

[[sources]]
id = "fcc_dpeba_2026"
source_id = "fcc_concursos"
scenario = "FCC atual; visualizador oficial com PDF real em parâmetro file"
start_url = "https://www.concursosfcc.com.br/concursos/dpeba125/index.html"
