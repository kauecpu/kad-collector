[collector]
data_dir = "data"
user_agent = "KADCollector/0.2 (+https://github.com/kauecpu/kad-collector)"
capacity_profile = "balanced"
request_interval_seconds = 3.0
timeout_seconds = 30.0
connect_timeout_seconds = 10.0
max_files_per_source = 40
max_html_bytes = 5000000
max_pdf_bytes = 50000000
max_archive_bytes = 100000000
max_archive_members = 250
max_archive_uncompressed_bytes = 250000000
max_archive_compression_ratio = 100.0
max_concurrency = 4
max_retries = 4
retry_max_delay_seconds = 120.0
conditional_cache = true
# Replay local opt-in for development only; keep false in production configs.
development_cache = false
resume_downloads = true
disk_quota_bytes = 5000000000
cloudflare_bypass_enabled = true
# O Qwen local entra somente quando as regras da pagina nao encontram nenhum
# documento. Ele escolhe indices de links permitidos; o motor continua
# validando dominio, exclusoes, robots.txt e o PDF baixado.
ai_discovery_enabled = true
ai_discovery_model = "qwen3:8b"
ai_discovery_max_steps_per_source = 3
ai_discovery_max_links_per_page = 120

# Decisao administrativa explicita do responsavel em 2026-08-18: as fontes
# oficiais ignoram robots.txt e Crawl-delay. A politica efetiva permanece
# registrada no manifesto, nos avisos e na telemetria de cada execucao.

# Acervo publico da Fundacao Universitaria para o Vestibular (FUVEST/USP).
# Os dois anos sao paginas HTML estaticas e cada PDF permanece atribuido a origem.
[[sources]]
id = "fuvest_vestibular"
name = "FUVEST - Vestibular USP"
enabled = true
start_urls = [
  "https://www.fuvest.br/acervo-vestibular-2026/",
  "https://www.fuvest.br/acervo-vestibular-2025/",
]
allowed_hosts = ["www.fuvest.br"]
robots_policy = "ignore"
crawl_delay_policy = "ignore"
include_patterns = [
  "(?i)(?:fuvest2026-fase1-(?:prova-v[1-4]|gabarito)|fuvest2025_(?:primeira_fase_prova_v[1-4]|gabarito_primeira_fase))\\.pdf(?:$|[?#])",
]
exclude_patterns = [
  "(?i)(manual|guia|edital|resolucao|lista|nota.?de.?corte|questionario|estatistica)",
]
exam_patterns = ["(?i)(prova|caderno)"]
answer_key_patterns = ["(?i)(gabarito|respostas.?esperadas)"]
pagination_patterns = ["(?i)/acervo-vestibular-(?:2025|2026)/?$"]
max_pages_per_run = 4
access_mode = "content"
authorization_basis = "Acervo oficial publico da FUVEST; coleta interna para revisao, com preservacao integral da origem e sem publicacao automatica."
terms_url = "https://www.fuvest.br/acervo/"

[sources.metadata]
banca = "FUVEST"
orgao = "Universidade de Sao Paulo"
cargo = "Vestibular"

