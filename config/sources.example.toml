[collector]
data_dir = "data"
user_agent = "KADCollector/0.1 (+contato@exemplo.com)"
request_interval_seconds = 3.0
timeout_seconds = 30.0
max_files_per_source = 20
max_html_bytes = 5000000
max_pdf_bytes = 50000000

# Este bloco e apenas um molde desativado. Substitua-o por uma fonte oficial
# cuja coleta tenha sido verificada e autorizada antes de definir enabled=true.
[[sources]]
id = "fonte_oficial_exemplo"
name = "Fonte oficial de exemplo"
enabled = false
start_urls = ["https://www.example.gov.br/provas"]
allowed_hosts = ["www.example.gov.br"]
include_patterns = ["(?i)prova", "(?i)gabarito", "(?i)\\.pdf(?:$|\\?)"]
exclude_patterns = ["(?i)resultado", "(?i)edital"]
exam_patterns = ["(?i)prova", "(?i)caderno"]
answer_key_patterns = ["(?i)gabarito"]
authorization_basis = "Descreva aqui a permissao ou base legal conferida."
terms_url = "https://www.example.gov.br/termos"

[sources.metadata]
banca = ""
orgao = ""
cargo = ""
ano = ""
