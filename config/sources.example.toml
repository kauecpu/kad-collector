[collector]
data_dir = "data"
user_agent = "KADCollector/0.1 (+contato@exemplo.com)"
capacity_profile = "custom"
request_interval_seconds = 3.0
timeout_seconds = 30.0
connect_timeout_seconds = 10.0
max_files_per_source = 20
max_html_bytes = 5000000
max_pdf_bytes = 50000000
max_concurrency = 4
max_retries = 4
retry_max_delay_seconds = 120.0
conditional_cache = true
# Replay local opt-in for development only; keep false in production configs.
development_cache = false
resume_downloads = true
disk_quota_bytes = 5000000000

# Este bloco e apenas um molde desativado. Substitua-o por uma fonte oficial
# cuja coleta tenha sido verificada e autorizada antes de definir enabled=true.
[[sources]]
id = "fonte_oficial_exemplo"
name = "Fonte oficial de exemplo"
enabled = false
start_urls = ["https://www.example.gov.br/provas"]
allowed_hosts = ["www.example.gov.br"]
discovery_strategies = ["html", "sitemap"]
sitemap_urls = ["https://www.example.gov.br/sitemap.xml"]
browser_enabled = false
robots_policy = "enforce"
crawl_delay_policy = "enforce"
include_patterns = ["(?i)prova", "(?i)gabarito", "(?i)\\.pdf(?:$|\\?)"]
exclude_patterns = ["(?i)resultado", "(?i)edital"]
exam_patterns = ["(?i)prova", "(?i)caderno"]
answer_key_patterns = ["(?i)gabarito"]
access_mode = "content"
authorization_basis = "Descreva aqui a permissao ou base legal conferida."
terms_url = "https://www.example.gov.br/termos"

[sources.metadata]
banca = ""
orgao = ""
cargo = ""
ano = ""

# Plataformas comerciais ficam desativadas. Mesmo no modo reference_only o coletor
# registra apenas identificador, URL e metadados; nunca baixa o enunciado nem o envia para IA.
# Habilite somente depois de obter autorizacao escrita especifica para acesso automatizado.
[[sources]]
id = "qconcursos_referencia"
name = "Qconcursos (somente referencia autorizada)"
enabled = false
start_urls = ["https://www.qconcursos.com/questoes-de-concursos/"]
allowed_hosts = ["www.qconcursos.com"]
include_patterns = ["(?i)/questoes-de-concursos/.*/[0-9]+(?:$|\\?)"]
exclude_patterns = []
exam_patterns = []
answer_key_patterns = []
access_mode = "reference_only"
authorization_basis = "Preencher somente apos autorizacao escrita do Qconcursos."
requires_written_authorization = true
written_authorization_reference = ""
terms_url = "https://www.qconcursos.com/termos-de-uso"

[[sources]]
id = "gran_questoes_referencia"
name = "Gran Questoes (somente referencia autorizada)"
enabled = false
start_urls = ["https://questoes.grancursosonline.com.br/"]
allowed_hosts = ["questoes.grancursosonline.com.br"]
include_patterns = ["(?i)/questoes-de-concursos/.*/[0-9]+(?:$|\\?)"]
exclude_patterns = []
exam_patterns = []
answer_key_patterns = []
access_mode = "reference_only"
authorization_basis = "Preencher somente apos autorizacao escrita do Gran."
requires_written_authorization = true
written_authorization_reference = ""
terms_url = "https://www.grancursosonline.com.br/termos-de-uso"
