name: Validate Collector pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use stable temporary paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install ".[dev,desktop,browser,database]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run lint
        shell: pwsh
        run: ruff check src tests

      - name: Run type checks
        shell: pwsh
        run: python -m mypy src

      - name: Validate desktop JavaScript
        shell: pwsh
        run: node --check src/kad_collector/desktop_app.js

      - name: Check patch whitespace
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check HEAD^1 HEAD
          } else {
            git diff --check HEAD^ HEAD
          }

      - name: Run packaged-resource smoke test
        shell: pwsh
        run: python -m kad_collector.desktop_app --smoke-test

  package-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install ".[build,browser,desktop]"

      - name: Build executable with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm KADCollector.spec

      - name: Smoke test built executable
        shell: pwsh
        run: |
          & .\dist\KAD-Collector.exe --smoke-test --data-dir "$env:RUNNER_TEMP\kad-collector-smoke"
          if ($LASTEXITCODE -ne 0) {
            throw "KAD-Collector.exe smoke test failed with exit code $LASTEXITCODE"
          }
