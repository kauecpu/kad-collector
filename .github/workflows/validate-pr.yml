name: Validate Collector pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

env:
  # Avoid 8.3 aliases such as RUNNER~1 in tempfile paths. Some regression
  # tests intentionally compare the submitted path with the validated path.
  TEMP: ${{ runner.temp }}
  TMP: ${{ runner.temp }}

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install ".[dev,desktop,browser,database]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Run lint
        shell: pwsh
        run: ruff check src tests

      - name: Run type checks
        shell: pwsh
        run: python -m mypy src

      - name: Validate desktop JavaScript
        shell: pwsh
        run: node --check src/kad_collector/desktop_app.js

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Run packaged-resource smoke test
        shell: pwsh
        run: python -m kad_collector.desktop_app --smoke-test
