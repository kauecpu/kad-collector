name: Build Collector executable

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-exe:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: windows-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,browser]"

      - name: Build executable with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm KADCollector.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAD-Collector-windows-${{ github.sha }}
          path: dist/KAD-Collector.exe
          if-no-files-found: error
          retention-days: 30
