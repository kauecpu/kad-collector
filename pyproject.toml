[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kad-collector"
version = "0.3.0"
description = "Pipeline privado e revisável de coleta de provas para o KAD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=3.1,<47",
  "httpx[http2]>=0.28,<1",
  "openai>=2.53,<3",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
database = ["psycopg[binary]>=3.2,<4"]
desktop = ["pywebview>=5.4,<6"]
browser = ["playwright>=1.54,<2"]
build = ["pyinstaller>=6.12,<7"]
dev = ["ruff>=0.9", "mypy>=1.14", "reportlab>=4.2,<5"]

[project.scripts]
kad-collector = "kad_collector.cli:main"
kad-collector-desktop = "kad_collector.desktop_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kad_collector = [
  "review_ui.html",
  "review_app.js",
  "review_styles.css",
  "desktop_ui.html",
  "desktop_app.js",
  "desktop_styles.css",
  "editorial_taxonomy.v1.json",
  "sources.official.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kad_collector"]
